name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  vectors-and-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r verifiers/requirements.txt
      - run: npm install --prefix verifiers --ignore-scripts
      - run: python verifiers/verify.py --vectors test-vectors/v0.2.1.json
      - run: node verifiers/verify.mjs --vectors test-vectors/v0.2.1.json
      - run: python -m unittest discover -s tests -v
